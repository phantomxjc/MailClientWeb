# 星尘邮箱 —— 直接 `docker compose up -d` 即可
# 飞牛 NAS：Docker → 项目 → 新建，粘贴本文件内容，或用 SSH 在项目目录执行上面的命令。
services:
  stardust:
    build:
      context: .
      args:
        # 国内直连 Docker Hub 会超时，默认走镜像站；海外或已配好加速可改回 python:3.12-slim
        PY_BASE: "${PY_BASE:-docker.1panel.live/library/python:3.12-slim}"
        PIP_INDEX: "${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    image: stardust:latest
    container_name: stardust
    restart: unless-stopped
    ports:
      # 左边是宿主机端口，想换只改它（比如 9080）
      - "${APP_PORT:-8090}:8090"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      # 登录：用户名 + 密码。留空则首次启动建管理员 admin / admin123，登录后到界面上改密码。
      #   想换初始密码：在本文件同目录建 .env 写入 AUTH_PASSWORD=你的强密码（只影响第一次建号）
      #   也可用 docker secrets：AUTH_PASSWORD_FILE=/run/secrets/auth
      AUTH_PASSWORD: "${AUTH_PASSWORD:-}"
      # 自动同步间隔（分钟），设 0 关闭
      SYNC_INTERVAL_MINUTES: "${SYNC_INTERVAL_MINUTES:-10}"
    volumes:
      # 数据库、微软令牌、加密密钥都在这里，删了就等于重置
      - ./data:/data
    labels:
      # 作者信息（docker inspect stardust 可见）
      org.opencontainers.image.authors: "轻度技术爱好玩家（phantomxjc）"
      org.opencontainers.image.source: "https://github.com/phantomxjc/StardustMail"
      org.opencontainers.image.description: "多邮箱统一收件箱。后续更新详情请关注微信公众号「轻度技术爱好玩家」"
